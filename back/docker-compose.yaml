services:
  db:
    image: postgres:17
    restart: always
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-talentify_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-talentify_password_2026}
      POSTGRES_DB: ${DB_NAME:-talentify_db}
    container_name: talentify_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-talentify_user} -d ${DB_NAME:-talentify_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talentify_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: talentify_pgadmin
    restart: always
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@talentify.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - talentify_network
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:

networks:
  talentify_network:
    driver: bridge
