name: Frontend

on:
  push:
    branches: ['**']
    paths: ['front/**', '.github/workflows/frontend.yml']
  pull_request:
    branches: [main, dev]
    paths: ['front/**', '.github/workflows/frontend.yml']

defaults:
  run:
    working-directory: front

jobs:
  # Job 1: lint, compilación y pruebas unitarias con cobertura
  unit-tests:
    name: Lint, build y pruebas unitarias
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Compilar
        run: pnpm build

      - name: Ejecutar pruebas unitarias con cobertura
        run: pnpm test:unit:coverage

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: front/coverage/
          retention-days: 7

  # Job 2: pruebas end-to-end con Playwright (usan mocks de la API)
  e2e-tests:
    name: Pruebas e2e (Playwright)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar pruebas e2e
        run: pnpm test:e2e

      - name: Subir reporte de Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: front/playwright-report/
          retention-days: 7
